#I have used to deploy application to aws ec2 with RDS postgres database. Please make sure to set the environment variables in .env file before running this docker-compose file.

services:
  app:
    build: .
    container_name: storemaster-app
    image: store-master:prod
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT:-30000}
      SPRING_DATASOURCE_HIKARI_INITIALIZATIONFAILTIMEOUT: ${SPRING_DATASOURCE_HIKARI_INITIALIZATIONFAILTIMEOUT:-30000}
      SPRING_DATASOURCE_HIKARI_VALIDATIONTIMEOUT: ${SPRING_DATASOURCE_HIKARI_VALIDATIONTIMEOUT:-5000}
      SPRING_DOCKER_COMPOSE_ENABLED: ${SPRING_DOCKER_COMPOSE_ENABLED:-false}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-false}
      SPRING_APPLICATION_NAME: StoreMaster
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-always}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS:-always}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:-INFO}
      TZ: ${TZ:-Asia/Kolkata}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Kolkata -XX:MaxRAMPercentage=75.0}
