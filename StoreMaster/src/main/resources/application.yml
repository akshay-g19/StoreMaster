spring:
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5433/storemaster_db
    username: postgres
    password: Postgrespw
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        JDBC:
          time_zone: Asia/Kolkata
  application:
    name: StoreMaster
management:
  endpoints:
    health:
      show-details: always
      show-components: always
    web:
      exposure:
        include: health,info,metrics
  info:
    app:
      name: StoreMaster
    build:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
      show-components: always
logging:
  level:
    org.springframework: DEBUG
    root: INFO
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
server:
  port: 8080