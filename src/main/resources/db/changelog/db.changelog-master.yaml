databaseChangeLog:
  - changeSet:
      id: 001-create-current-schema
      author: storemaster
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_email
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE

        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: price
                  type: NUMERIC(38, 2)
              - column:
                  name: stock_quantity
                  type: INTEGER
              - column:
                  name: category
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE

        - createTable:
            tableName: cart
            columns:
              - column:
                  name: cart_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_cart_user
              - column:
                  name: total_price
                  type: NUMERIC(38, 2)
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE

        - createTable:
            tableName: cart_item
            columns:
              - column:
                  name: cart_item_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_item
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
              - column:
                  name: price
                  type: NUMERIC(38, 2)
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: total
                  type: NUMERIC(38, 2)
              - column:
                  name: status
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE

        - createTable:
            tableName: order_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_item
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(38, 2)
              - column:
                  name: product_id
                  type: BIGINT
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cart
            baseColumnNames: user_id
            constraintName: fk_cart_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: cart_item
            baseColumnNames: product_id
            constraintName: fk_cart_item_product
            referencedTableName: products
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: cart_item
            baseColumnNames: cart_id
            constraintName: fk_cart_item_cart
            referencedTableName: cart
            referencedColumnNames: cart_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: order_item
            baseColumnNames: order_id
            constraintName: fk_order_item_order
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE
