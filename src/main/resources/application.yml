spring:
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/storemaster_db
    username: postgres
    password: Postgrespw
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  application:
    name: StoreMaster
management:
  endpoints:
    health:
      show-components: always
    web:
      exposure:
        include: health,info
  info:
    app:
      name: StoreMaster
    build:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
      show-components: always
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: INFO
    org:
      hibernate:
        SQL: INFO
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
server:
  port: 8081
