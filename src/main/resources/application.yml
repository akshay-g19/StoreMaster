spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/storemaster_db
    username: postgres
    password: Postgrespw
    hikari:
      maximum-pool-size: 10 # Maximum number of connections in the pool default is 10
      minimum-idle: 5 # Minimum number of idle connections in the pool default is same as maximum-pool-size
      connection-timeout: 3000 # Connection timeout in milliseconds default is 30000
      max-lifetime: 1800000 # Maximum lifetime of a connection in milliseconds default is 1800000
      idle-timeout: 60000 # Idle timeout in milliseconds default is 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  application:
    name: StoreMaster
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    app:
      name: StoreMaster
    build:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
      show-components: always
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: INFO
        type:
          descriptor:
            sql:
              BasicBinder: INFO
server:
  port: 8080
